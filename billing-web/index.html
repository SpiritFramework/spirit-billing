<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Spirit Billing</title>
    <script>
      /* Apply last-known theme before CSS/React to avoid default-theme flash */
      (function () {
        try {
          var ATTR_KEYS = {
            'data-theme': 1,
            'data-density': 1,
            'data-sidebar': 1,
            'data-navbar': 1,
            'data-radius': 1,
            'data-auth-bg': 1,
            'data-client-bg': 1,
            'data-admin-bg': 1,
            'data-client-nav': 1,
            'data-admin-nav': 1
          };
          var CSS_VAR_RE = /^--[a-z0-9-]+$/i;
          var UNSAFE = /url\s*\(|expression\s*\(|javascript:|<|>/i;
          function safeAttr(v) {
            return typeof v === 'string' && v && v.length <= 64 && !UNSAFE.test(v) && !/[\s"'`=]/.test(v);
          }
          function safeCss(v) {
            return typeof v === 'string' && v && v.length <= 200 && !UNSAFE.test(v);
          }
          var raw = localStorage.getItem('spirit-billing-theme-dom');
          if (!raw) return;
          var cache = JSON.parse(raw);
          if (!cache || typeof cache !== 'object') return;
          var root = document.documentElement;
          if (cache.attrs) {
            for (var key in cache.attrs) {
              if (ATTR_KEYS[key] && safeAttr(cache.attrs[key])) {
                root.setAttribute(key, cache.attrs[key]);
              }
            }
          }
          if (cache.vars) {
            for (var prop in cache.vars) {
              if (CSS_VAR_RE.test(prop) && safeCss(cache.vars[prop])) {
                root.style.setProperty(prop, cache.vars[prop]);
              }
            }
          }
          if (typeof cache.title === 'string' && cache.title.trim() && cache.title.length <= 120 && cache.title.indexOf('<') === -1) {
            document.title = cache.title;
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

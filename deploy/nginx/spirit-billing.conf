# Spirit Billing — nginx site
# Place at: /etc/nginx/sites-available/spirit-billing
# Enable:   ln -s /etc/nginx/sites-available/spirit-billing /etc/nginx/sites-enabled/
#
# Replace billing.example.com with your domain before enabling SSL.
# After DNS points here: certbot --nginx -d billing.example.com

upstream spirit_billing_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

# Redirect HTTP → HTTPS (Certbot will adjust this; keep until certs exist)
server {
    listen 80;
    listen [::]:80;
    server_name billing.example.com;

    # ACME HTTP-01
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name billing.example.com;

    # Certbot paths (created by: certbot --nginx -d billing.example.com)
    ssl_certificate     /etc/letsencrypt/live/billing.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/billing.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Static SPA (built billing-web)
    root /var/www/spirit-billing;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Hide nginx version
    server_tokens off;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # API → Node on loopback only (never expose :3001 publicly)
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://spirit_billing_api;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Health (optional direct check)
    location = /health {
        proxy_pass http://spirit_billing_api/health;
        access_log off;
    }

    # Ticket / upload images (served by API from UPLOADS_DIR)
    location /uploads/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://spirit_billing_api;
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA assets — long cache for hashed builds
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny hidden / sensitive paths
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
